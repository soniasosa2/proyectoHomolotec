{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomoloTec - Iniciar Sesión</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos de HomoloTec -->
    <link rel="stylesheet" href="{% static 'app1/css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-wrapper">
    
        <!-- Logo HomoloTec con Imagen -->
        <div class="logo-container">
            <img src="{% static 'app1/images/logo.png' %}" alt="Logo HomoloTec" style="max-width: 260px; height: auto;">
        </div>

        <!-- Tarjeta blanca de Login -->
        <div class="login-card">
            <h2 class="card-title-login">INICIAR SESIÓN</h2>
                        <!-- Mensaje de error si el usuario o contraseña no coinciden -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 mb-3" style="font-size: 0.85rem;" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3 text-start">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" required autocomplete="email" placeholder="nombre@correo.com">
                </div>

                <div class="mb-3 text-start">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-teal w-100 py-2 mt-2">INGRESAR</button>
            </form>

            <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>

            <div class="divider">o</div>

            <a href="{% url 'activar_cuenta' %}" class="btn btn-outline-teal w-100 py-2">ACTIVAR CUENTA</a>
        </div>
    </div>

    <!-- Bootstrap JS y Script propio -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'app1/js/script.js' %}"></script>
</body>
</html>
